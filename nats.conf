# Client port of 4222 on all interfaces
host: 0.0.0.0
port: 4222
server_name = heynats
# HTTP monitoring port
monitor_port: 8222

# SYS can't hold JetStream, so streams and KV live in APP.
system_account: SYS

accounts: {
    APP: {
        users: [
            {
                user: "admin",
                password: "$2a$11$D3aCTAqs/y7tgR0Yu3j03eyd3dgYH5yaReEGk7vSn30bz/r09p9a2"
            }
        ],
        jetstream: enabled
        # Shared with USER, so the Accounts view has an export/import pair to show.
        exports: [
            { stream: "events.>" }
            { service: "billing.quote" }
        ]
        mappings: {
            "orders.legacy.>": "orders.>"
        }
    }
    USER: {
        users: [
            {
                user: "mukezhz",
                password: "$2a$11$D3aCTAqs/y7tgR0Yu3j03eyd3dgYH5yaReEGk7vSn30bz/r09p9a2",
                permissions: {
                    publish: {
                        allow: ["logs.>"]
                    },
                    subscribe: {
                        allow: ["logs.>"]
                    }
                }
            }
        ]
        imports: [
            { stream: { account: APP, subject: "events.>" } }
            { service: { account: APP, subject: "billing.quote" } }
        ]
    }
    SYS: {
        users: [
            {
                user: "sys",
                password: "$2a$11$D3aCTAqs/y7tgR0Yu3j03eyd3dgYH5yaReEGk7vSn30bz/r09p9a2"
            }
        ]
    }
}
jetstream {
    store_dir: "/tmp/jetstream"
    max_memory_store: 1073741824
    max_file_store: 10737418240
}
